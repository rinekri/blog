  text = "Ten years in Android, all of them at KODE. I joined as a developer in 2016 and spent the next four years just learning the craft — junior to senior, one shipped project at a time. Became Team Lead in 2020, and by 2025 I was leading the whole Android department, 26 people, split across deputies handling day-to-day people management and tech leads running the technical vertical."

