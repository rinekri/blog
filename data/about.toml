# Data for /about/ (templates/about.html).
# Each section's `blocks` array is an ordered mix of typed content blocks —
# needed because these sections interleave different component types
# (a paragraph, then a timeline, then a pull-quote, then another paragraph)
# rather than being a uniform list of one thing. Block `type` values the
# template knows how to render: "paragraph" (safe HTML text), "arc"
# (a small node/year/note timeline), "pull" (a blockquote-style callout),
# "systems_grid" (two-column org-tree pair, items optionally link to a
# /projects/ entry via `project_seed`), "chips" (a row of plain tag chips).
#
# Link hrefs in text fields are plain paths, not Tera `get_url()` calls —
# TOML string values are loaded as inert data, so any `{{ }}` inside one
# would print literally instead of being evaluated. Internal links here
# also don't get zola check's build-time link validation as a result.

lead_strip = "I'm Ilia — an Android engineer, currently leading KODE's Android department, though becoming a manager was never really the plan. I also can't stop building infrastructure, at work and at home, whether anyone asked me to or not. This page covers what <a href=\"/resume/\">/resume/</a> doesn't."

