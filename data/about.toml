[[sections]]
id = "why"
num = "04"
label = "Why"
portrait_ring = "purpose"

  [[sections.blocks]]
  type = "paragraph"
  text = "I live with celiac disease. It's shaped a lot of quiet, everyday problem-solving — figuring out what's actually safe to eat somewhere new, tracking down the right specialist, learning to read a menu almost like reading source code. At some point that turned into something bigger than just managing it for myself: I want to make that easier for other adults with celiac too — better information about where's actually safe to eat, support for real treatment research, backing the organizations already doing this work. Still early, honestly — more an intention than an actual project right now. But it's the same instinct as everything else on this page: if the system around you doesn't work well enough, you go build the missing part yourself."

  [[sections.blocks]]
  type = "pull"
  text = "Whether it's a CI pipeline, a home network, or making sure someone else with celiac disease can find a safe meal — I'd rather build the missing piece than wait for someone else to."

