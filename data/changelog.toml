# Data for /changelog/ (templates/changelog.html) — a hand-maintained log of
# real changes to /projects/, /resume/, /stack/, and similar data-driven
# pages, distinct from the blog itself. Dates and substance come from actual
# git history, not auto-generated from data/projects.toml (which has no
# reliable per-entry "last touched" timestamp to diff against). Add an entry
# by hand whenever a change to that kind of page is worth surfacing —
# newest first.

