num = "05"
label = "Org structure"

  [[sections.blocks]]
  type = "paragraph"
  text = "Since 2025, two axes under me as Team Lead (strategy, final calls): two deputies running day-to-day people management for the two developer teams, and two tech leads running the technical vertical — architecture and code review — across both teams, not owning a team of their own."

