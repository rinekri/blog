# Data for /projects/ (templates/projects.html).
# "card" items render in the .anchors grid (flagship/most-interesting per group, with a
# generative fingerprint canvas); "row" items render in the denser .prow list below.

lead_strip = "Alongside engineering work, I lead <b>KODE's Android department — 26 people</b> (grown from 17 over 2025). <a href=\"/leadership/\">More on hiring, mentorship, and grading →</a>"
lead_strip_secondary = "Prefer a different view? Browse the <a href=\"/stack/\">stack wall</a> or the <a href=\"/graph/\">project graph</a> →"
#
# Additional fields (added for /resume/, see data/resume.toml):
#   company            - "KODE" for every commercial/opensource item (outstaff/client work is
#                         still KODE employment); omitted entirely for personal-group items.
#   role               - only set when company is set. Three eras, matching data/resume.toml's
#                         employment array: "Android Department Lead" (2025+), "Team Lead"
#                         (2020-2024, plus Otkritie — dated 2019-20 but it's the project that
#                         actually led to the promotion), "Android Developer" (before 2020).
#                         Used by /resume/ to bucket items under the matching era.
#   date_start/date_end - parsed from the existing `meta` year fragment. Informational only,
#                         not used for filtering. date_end = "present" for open-ended spans
#                         or spans reaching into the current year (2026). Omitted for
#                         personal/idea-stage items with a literal "—" placeholder.
#   category           - only set on company="KODE" items. One of "leadership" (people/process
#                         management), "architecture" (tech-lead/process/tooling authorship),
#                         "feature" (shipped IC/product work). Drives /resume/'s 3-bucket
#                         grouping (templates/resume.html) — items missing this field simply
#                         don't appear in any Experience bucket, so keep it set on every
#                         company="KODE" entry.
#   achievements       - optional list of strings, concrete results/impact. Shown in the
#                         /projects/ expand panel alongside architecture/stack. Omitted where
#                         no verifiable detail exists beyond `desc` — don't pad with filler.
#   features           - optional list of strings, granular "what was built" (concrete screens/
#                         flows/modules), one line per feature — more exhaustive and less curated
#                         than `achievements` (which stays impact-focused highlights). Rendered
#                         `| safe`, same list markup as achievements, shown above it in the
#                         expand panel. Omitted where there's nothing beyond what
#                         `desc`/`achievements` already say — don't pad with filler.
#   architecture       - optional single string, technical approach/notes. Rendered `| safe`
#                         (same convention as `desc`, which already embeds inline
#                         `<span class="mask">` markup for confidential entries).
#   stack              - concrete named technologies/techniques drawn from each entry's own
#                         achievements/architecture text, not just the top-level framework.
#                         Used to render only once per entry — inside the Details expand panel
#                         (a duplicate short preview on the row face was removed) — so there's
#                         no fixed tag-count cap; add as many specific names as the entry's own
#                         detail supports. Shown on /resume/'s Selected Projects grid and in the
#                         /projects/ expand panel.
#
# Confidentiality note: achievements/architecture text must not name a client/employer beyond
# what `vis`/`badge_label`/`desc` already discloses for that entry — keep the same masking
# discipline `desc` already uses for `vis = "confidential"` items.

[[groups]]
key = "commercial"
