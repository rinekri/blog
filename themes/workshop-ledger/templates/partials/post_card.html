<a class="post-card" href="{{ page.permalink }}">
    <canvas class="post-card__fp" data-seed="{{ page.slug }}" width="640" height="160" aria-hidden="true"></canvas>
    <span class="post-card__meta">
        <span title="{{ page.date | date(format='%Y-%m-%d %H:%M:%S %z') }}">{{ page.date | date(format=config.extra.date_format) }}</span>
        {% if config.extra.show_reading_time %}<span>{{ page.reading_time }} min</span>{% endif %}
    </span>
    <h3 class="post-card__title">{{ page.title }}</h3>
    {% if page.summary %}<p class="post-card__summary">{{ page.summary | safe }}</p>{% endif %}
</a>
